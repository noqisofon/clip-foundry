[package]
name = "clip-foundry"
version = "0.1.0"
description = "クリップ工場オートメーション"
edition = "2021"

[lib]
name = "clip_foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
